# SPDX-License-Identifier: Apache-2.0
# The linear matmuls in Lean 4 and Slang: the kernels against the reference model, the committed
# kernels against what Lean emits, and the model against weights that the engine builds.
#
# macOS arm64: the committed C++ emissions contain the Slang prelude exactly as the macOS slangc
# writes it, so `kernels/gen.exs --check` compares like with like.
#
# The C++ host runs every kernel. A kernel with group barriers runs as a DAG of executes, one per
# process. The macos-15 runner has a Metal device (an Apple Paravirtual device), so `--metal` also
# runs every kernel on it. The two largest shapes (34816x5120 and 5120x6144) are skipped to bound
# the run time. `elixir tests/kernels/run.exs --metal` without `--skip-big` runs everything.
name: lean-kernels

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'lean/**'
      - '.github/workflows/lean-kernels.yml'
      # the fixture code of the engine, which tests/layout/run.exs includes
      - 'tests/ops/quantized_weight.h'
      - 'src/core/weight.h'
      - 'src/core/tensor.h'
      - 'src/core/dtype.h'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean-kernels.yml'
      # the fixture code of the engine, which tests/layout/run.exs includes
      - 'tests/ops/quantized_weight.h'
      - 'src/core/weight.h'
      - 'src/core/tensor.h'
      - 'src/core/dtype.h'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernels:
    # macos-14 images retired on 2026-11-02. macos-15 is arm64.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: slangc 2026.13
        run: |
          curl -sSfL -o slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.13/slang-2026.13-macos-aarch64.tar.gz
          mkdir -p "$HOME/slang" && tar -xzf slang.tar.gz -C "$HOME/slang"
          echo "$HOME/slang/bin" >> "$GITHUB_PATH"
      - name: Elixir and the SPIR-V validator
        run: brew install elixir spirv-tools
      - name: lake build
        run: lake build
      - name: number formats against the host compiler
        run: elixir tests/num/run.exs
      - name: weights of the engine against the model
        run: elixir tests/layout/run.exs
      - name: committed kernels are what Lean emits
        run: elixir kernels/gen.exs --check
      - name: kernels against the model, controls, targets, on the C++ host and on Metal
        run: elixir tests/kernels/run.exs --metal --skip-big
