[workspace]
name = "ninfer-mojo"
description = "Mojo inference stack for NInfer; Elixir (via mojoler NIFs) serves it"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
mojo = "==1.3.0.dev2026111316"
python = "3.12.*"
max = "==26.8.0.dev2026111316"
pytest = "*"
regex = "*"

[tasks]
test = "python -m pytest tests -q"
